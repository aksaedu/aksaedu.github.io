name: Deploy Vite App to GitHub Pages

on:
  push:
    branches: [main] # Ganti dengan 'master' jika branch utama Anda master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build # Ini akan membaca konfigurasi 'base' dan membuat folder dist

      - name: Upload artifact ke GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Mengarah ke folder output Vite

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4